<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" fill="none">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0369A1" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#060911" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#04060A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cockpitStrutLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#1A2536"/>
    </linearGradient>
    <linearGradient id="cockpitStrutRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="50%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#1A2536"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep Space / Sky Gradient -->
  <rect width="1440" height="600" fill="#04060A"/>
  <rect width="1440" height="600" fill="url(#skyGlow)"/>

  <!-- Subtle Perspective Floor Grid -->
  <g opacity="0.25">
    <line x1="720" y1="280" x2="-200" y2="600" stroke="#00E5FF" stroke-width="1"/>
    <line x1="720" y1="280" x2="100" y2="600" stroke="#00E5FF" stroke-width="1"/>
    <line x1="720" y1="280" x2="400" y2="600" stroke="#00E5FF" stroke-width="1"/>
    <line x1="720" y1="280" x2="720" y2="600" stroke="#00E5FF" stroke-width="1"/>
    <line x1="720" y1="280" x2="1040" y2="600" stroke="#00E5FF" stroke-width="1"/>
    <line x1="720" y1="280" x2="1340" y2="600" stroke="#00E5FF" stroke-width="1"/>
    <line x1="720" y1="280" x2="1640" y2="600" stroke="#00E5FF" stroke-width="1"/>

    <line x1="200" y1="450" x2="1240" y2="450" stroke="#00E5FF" stroke-width="0.8"/>
    <line x1="100" y1="520" x2="1340" y2="520" stroke="#00E5FF" stroke-width="0.8"/>
    <line x1="0" y1="580" x2="1440" y2="580" stroke="#00E5FF" stroke-width="0.8"/>
  </g>

  <!-- Concentric Holographic HUD Target Rings in Center of Cockpit View -->
  <circle cx="720" cy="240" r="280" fill="none" stroke="#00E5FF" stroke-width="0.7" stroke-opacity="0.15" stroke-dasharray="10 5"/>
  <circle cx="720" cy="240" r="220" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
  <circle cx="720" cy="240" r="160" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.25"/>
  <circle cx="720" cy="240" r="90" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="20 10"/>
  <circle cx="720" cy="240" r="4" fill="#00E5FF" opacity="0.6"/>

  <!-- Sci-Fi Cockpit Angled Hull Struts (Left Side) -->
  <polygon points="0,0 240,0 120,600 0,600" fill="url(#cockpitStrutLeft)"/>
  <polygon points="240,0 250,0 130,600 120,600" fill="#00E5FF" fill-opacity="0.3"/>
  <line x1="245" y1="0" x2="125" y2="600" stroke="url(#glowLine)" stroke-width="2"/>
  <polygon points="0,0 160,0 40,600 0,600" fill="#030508"/>

  <!-- Sci-Fi Cockpit Angled Hull Struts (Right Side) -->
  <polygon points="1440,0 1200,0 1320,600 1440,600" fill="url(#cockpitStrutRight)"/>
  <polygon points="1200,0 1190,0 1310,600 1320,600" fill="#00E5FF" fill-opacity="0.3"/>
  <line x1="1195" y1="0" x2="1315" y2="600" stroke="url(#glowLine)" stroke-width="2"/>
  <polygon points="1440,0 1280,0 1400,600 1440,600" fill="#030508"/>

  <!-- Top Cockpit Ceiling Canopy Trim -->
  <polygon points="0,0 1440,0 1250,45 190,45" fill="#0A0F1A" stroke="#1E293B" stroke-width="1"/>
  <line x1="220" y1="45" x2="1220" y2="45" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
