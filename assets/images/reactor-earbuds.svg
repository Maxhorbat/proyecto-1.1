<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <radialGradient id="caseAmbient" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="budGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="200" cy="205" rx="130" ry="20" fill="#020617" opacity="0.85"/>
  <ellipse cx="200" cy="120" rx="140" ry="70" fill="url(#caseAmbient)"/>

  <!-- Charging Case Base Unit -->
  <rect x="110" y="95" width="180" height="95" rx="20" fill="url(#bodyCase)" stroke="#475569" stroke-width="2"/>
  <rect x="115" y="100" width="170" height="85" rx="16" fill="#090E17" stroke="#1E293B" stroke-width="1"/>

  <!-- Front LED Battery / Status Strip -->
  <rect x="160" y="165" width="80" height="4" rx="2" fill="#1E293B"/>
  <rect x="160" y="165" width="65" height="4" rx="2" fill="#00E5FF" filter="url(#budGlow)"/>

  <!-- Open Lid Silhouette in Background (Hinged at top) -->
  <path d="M110 95 C110 50, 150 45, 200 45 C250 45, 290 50, 290 95" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M118 90 C125 55, 155 52, 200 52 C245 52, 275 55, 282 90" fill="#0F172A" fill-opacity="0.7"/>

  <!-- Left Earbud Dock Cradle -->
  <ellipse cx="155" cy="125" rx="26" ry="24" fill="#030712" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Left Earbud Body -->
  <ellipse cx="155" cy="122" rx="20" ry="18" fill="#1E293B" stroke="#00E5FF" stroke-width="1.5"/>
  <!-- Left Arc Touchpad -->
  <circle cx="155" cy="122" r="10" fill="#0A101D" stroke="#FFB800" stroke-width="1.2"/>
  <circle cx="155" cy="122" r="5" fill="#00E5FF" filter="url(#budGlow)"/>
  <circle cx="155" cy="122" r="2" fill="#FFFFFF"/>

  <!-- Right Earbud Dock Cradle -->
  <ellipse cx="245" cy="125" rx="26" ry="24" fill="#030712" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Right Earbud Body -->
  <ellipse cx="245" cy="122" rx="20" ry="18" fill="#1E293B" stroke="#00E5FF" stroke-width="1.5"/>
  <!-- Right Arc Touchpad -->
  <circle cx="245" cy="122" r="10" fill="#0A101D" stroke="#FFB800" stroke-width="1.2"/>
  <circle cx="245" cy="122" r="5" fill="#00E5FF" filter="url(#budGlow)"/>
  <circle cx="245" cy="122" r="2" fill="#FFFFFF"/>

  <!-- Stark Logo Text on Front Casing -->
  <text x="180" y="152" font-family="'Orbitron', sans-serif" font-size="7" fill="#64748B" letter-spacing="2">STARK</text>
  
  <!-- Subtle Tactical Corner Bumpers -->
  <rect x="108" y="115" width="4" height="25" rx="2" fill="#FFB800"/>
  <rect x="288" y="115" width="4" height="25" rx="2" fill="#FFB800"/>
</svg>
